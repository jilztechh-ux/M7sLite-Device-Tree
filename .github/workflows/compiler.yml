name: Compilar TWRP Multilaser M7s Lite (Oreo 8.1)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
    - name: Limpiar y Configurar Espacio de Trabajo Virtual
      uses: actions/checkout@v4

    - name: Instalar Dependencias de Compilación AOSP
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

    - name: Inicializar Herramienta Repo y Sincronizar Fuentes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        
        mkdir workspace && cd workspace
        curl https://googleapis.com > repo
        chmod a+x repo
        
        ./repo init --depth=1 -u https://github.com -b twrp-8.1
        ./repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

    - name: Importar Arbol de Dispositivo de la Multilaser
      run: |
        cd workspace
        git clone ${{ github.server_url }}/${{ github.repository }}.git device/multilaser/ML-SO06-M7sLite

    - name: Ejecutar Compilacion de la Imagen Recovery
      run: |
        cd workspace
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch omni_ML-SO06-M7sLite-eng
        mka recoveryimage
        cp out/target/product/ML-SO06-M7sLite/recovery.img ../TWRP_M7sLite_Final.img

    - name: Almacenar y Entregar TWRP Compilado
      uses: actions/upload-artifact@v4
      with:
        name: TWRP_Multilaser_M7sLite_8.1
        path: TWRP_M7sLite_Final.img
